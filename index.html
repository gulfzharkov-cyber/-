function show(t,a=true){tab=t;if(a){const v=$("#v");v.classList.remove("view");void v.offsetWidth;v.classList.add("view")}document.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t==t));({st:stationsV,sf:staffV,hi:historyV,ca:cashierV})[t]()}

/* ---------- АЗС и цены ---------- */
function stationsV(){
 $("#v").innerHTML=`<div class="card"><h2>Новая АЗС</h2><div class="row"><div><label>Название</label><input id="n"></div><div><label>Адрес</label><input id="a"></div></div>
 <div class="row">${Object.entries(FUELS).map(([k,v])=>`<div><label>${v}, ₽/л</label><input id="p_${k}" type="number" step="0.01"></div>`).join("")}</div>
 <div id="m"></div><button class="btn" id="add">Добавить АЗС</button></div>
 <div class="card"><h2>Цены на АЗС</h2><table><tr><th>АЗС</th>${Object.values(FUELS).map(v=>`<th>${v}</th>`).join("")}<th></th></tr>
 ${stations.map(s=>`<tr data-id="${s.id}"><td><b>${esc(s.name)}</b><br><small>${esc(s.address)}</small></td>${Object.keys(FUELS).map(k=>`<td><input data-k="${k}" type="number" step="0.01" value="${s.prices?.[k]??""}"></td>`).join("")}<td><button class="btn s sv" style="margin:0">Сохранить</button> <button class="btn g dl" style="margin:0">Удалить</button></td></tr>`).join("")||"<tr><td>Пока нет АЗС</td></tr>"}</table></div>`;
 const pr=el=>Object.fromEntries([...el.querySelectorAll("[data-k],[id^=p_]")].filter(i=>i.value!=="").map(i=>[i.dataset.k||i.id.slice(2),parseFloat(i.value)]));
 $("#add").onclick=async()=>{if(!$("#n").value.trim())return msg("#m","Введите название");
  const prices=Object.fromEntries(Object.keys(FUELS).filter(k=>$("#p_"+k).value!=="").map(k=>[k,parseFloat($("#p_"+k).value)]));
  await addDoc(collection(db,"stations"),{name:$("#n").value.trim(),address:$("#a").value.trim(),prices,createdAt:serverTimestamp()});toast("АЗС добавлена")};
 document.querySelectorAll(".sv").forEach(b=>b.onclick=async()=>{const tr=b.closest("tr");await updateDoc(doc(db,"stations",tr.dataset.id),{prices:pr(tr)});toast("Цены сохранены")});
 document.querySelectorAll(".dl").forEach(b=>b.onclick=()=>confirm("Удалить АЗС?")&&deleteDoc(doc(db,"stations",b.closest("tr").dataset.id)));
}

/* ---------- сотрудники ---------- */
async function staffV(){
 $("#v").innerHTML=`<div class="card"><h2>Назначить роль</h2><p style="color:#5b6b82;margin:0">Сотрудник сначала регистрируется сам (в приложении или на этой странице), затем вы вводите его email.</p>
 <label>Email сотрудника</label><input id="e"><div class="row"><div><label>Роль</label><select id="r"><option value="cashier">Кассир</option><option value="admin">Администратор</option><option value="client">Обычный клиент</option></select></div>
 <div><label>АЗС (для кассира)</label><select id="s">${stations.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div></div>
 <div id="m"></div><button class="btn" id="go">Назначить</button></div><div class="card"><h2>Сотрудники</h2><div id="l">Загрузка…</div></div>`;
 $("#go").onclick=async()=>{try{const f=await getDocs(query(collection(db,"users"),where("email","==",$("#e").value.trim())));
  if(f.empty)return msg("#m","Пользователь с таким email не зарегистрирован");
  const uid=f.docs[0].id,r=$("#r").value;await updateDoc(doc(db,"users",uid),{role:r});
  if(r=="cashier")await setDoc(doc(db,"staff",uid),{role:r,stationId:$("#s").value,assignedAt:serverTimestamp()});
  toast("Роль назначена");staffV()}catch(x){msg("#m","Ошибка: "+x.code)}};
 const all=await getDocs(collection(db,"users"));
 $("#l").innerHTML="<table>"+all.docs.filter(d=>d.data().role!="client").map(d=>`<tr><td>${esc(d.data().email)}</td><td>${d.data().role=="admin"?"Администратор":"Кассир"}</td></tr>`).join("")+"</table>";
}

/* ---------- транзакции ---------- */
async function historyV(){
 $("#v").innerHTML=`<div class="card"><h2>Последние 50 операций</h2><div id="l">Загрузка…</div></div>`;
 const s=await getDocs(query(collection(db,"transactions"),orderBy("createdAt","desc"),limit(50)));
 const st=id=>stations.find(x=>x.id==id)?.name||"—";
 $("#l").innerHTML=`<table><tr><th>Дата</th><th>АЗС</th><th>Топливо</th><th>Литры</th><th>Итого</th><th>Бонусы</th></tr>`+s.docs.map(d=>{const t=d.data();return`<tr><td>${t.createdAt?.toDate().toLocaleString("ru")||""}</td><td>${esc(st(t.stationId))}</td><td>${FUELS[t.fuelType]||""}</td><td>${t.liters}</td><td>${t.finalPrice} ₽</td><td>+${t.bonusesEarned}</td></tr>`}).join("")+"</table>";
}

/* ---------- касса ---------- */
/* Программа лояльности (должна совпадать с приложением, см. Loyalty в MainActivity.kt) */
const LOYALTY={rate:10,tiers:[{min:5000,pct:5},{min:1000,pct:3},{min:0,pct:0}]};
const discountFor=b=>LOYALTY.tiers.filter(t=>b>=t.min).sort((a,c)=>c.min-a.min)[0].pct;
const bonusFor=sum=>Math.floor(sum/LOYALTY.rate);
function cashierV(){
 $("#v").innerHTML=`<div class="card"><h2>Оплата по QR</h2><label>АЗС</label><select id="s">${stations.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
 <div class="row"><div><label>Топливо</label><select id="f">${Object.entries(FUELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div><div><label>Литры</label><input id="l" type="number" step="0.01"></div></div>
 <button class="btn g" id="sc">Сканировать QR клиента</button><div id="qr"></div><label>Код сессии (заполнится после сканирования)</label><input id="sid">
 <div id="m"></div><button class="btn s" id="go">Подтвердить оплату</button><div id="res"></div></div>`;
 let sc;$("#sc").onclick=async()=>{sc=new Html5Qrcode("qr");try{await sc.start({facingMode:"environment"},{fps:10,qrbox:220},t=>{$("#sid").value=t;sc.stop().then(()=>$("#qr").innerHTML="")})}catch{msg("#m","Нет доступа к камере — вставьте код вручную")}};
 $("#go").onclick=async()=>{const sid=$("#sid").value.trim(),L=parseFloat($("#l").value),sId=$("#s").value,fuel=$("#f").value;
  if(!sid||!L||L<=0)return msg("#m","Отсканируйте QR и введите литры");
  try{const r=await runTransaction(db,async tx=>{
   const sr=doc(db,"qr_sessions",sid),ss=await tx.get(sr);if(!ss.exists())throw"QR не найден";const se=ss.data();
   if(se.status!="pending")throw"QR уже использован";if(Date.now()-se.createdAt.toMillis()>18e4)throw"QR истёк — пусть клиент создаст новый";
   const ur=doc(db,"users",se.userId),u=await tx.get(ur),st=await tx.get(doc(db,"stations",sId));
   const price=st.data()?.prices?.[fuel];if(price==null)throw"Нет цены на это топливо";
   const total=Math.round(price*L*100)/100,dp=discountFor(u.data().bonuses||0),da=Math.round(total*dp)/100,fin=Math.round((total-da)*100)/100,b=bonusFor(fin);
   const tr=doc(collection(db,"transactions"));
   tx.set(tr,{userId:se.userId,stationId:sId,cashierId:auth.currentUser.uid,fuelType:fuel,liters:L,pricePerLiter:price,totalPrice:total,discountPercent:dp,discountAmount:da,finalPrice:fin,bonusesEarned:b,createdAt:serverTimestamp()});
   tx.update(ur,{bonuses:(u.data().bonuses||0)+b,lastTxId:tr.id});tx.update(sr,{status:"used",usedAt:serverTimestamp(),transactionId:tr.id});
   return{name:u.data().name||u.data().email,dp,da,fin,b}});
   $("#res").innerHTML=`<p class="ok"><b>Оплата подтверждена</b><br>Клиент: ${esc(r.name)}<br>Скидка: ${r.dp}% (−${r.da} ₽)<br>К оплате: <b>${r.fin} ₽</b><br>Начислено бонусов: +${r.b}</p>`;msg("#m","");$("#sid").value="";toast("Оплата подтверждена")}
  catch(x){msg("#m",typeof x=="string"?x:"Не удалось провести оплату: "+(x.code||x.message))}};
}
</script></body></html>
